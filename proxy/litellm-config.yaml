# LiteLLM proxy config: exposes an Anthropic-Messages-compatible /v1/messages
# endpoint and translates to NVIDIA NIM's OpenAI-compatible chat/completions.
# Model names on the left are what the agent requests via options.model;
# litellm_params.model on the right is the actual NIM-hosted model.
# NVIDIA retires models from the NIM catalog without notice, and a request for
# a retired model fails with HTTP 410 rather than falling back. The upstream
# names below were verified against a live catalog on 2026-09-23; re-check with:
#   curl -H "Authorization: Bearer $NVIDIA_NIM_API_KEY" \
#        https://integrate.api.nvidia.com/v1/models
#
# Latency note: only z-ai/glm-5.3 is reliably warm on the free tier (~1s).
# The rest are cold-start bound -- up to 429s measured on a direct curl to
# NVIDIA with the proxy out of the path -- so treat them as batch-only until
# they have been warmed.
model_list:
  # These three are what the headless Docker agent uses (matched against
  # real Claude model names so the SDK's own assumptions hold).
  - model_name: claude-sonnet-4-6 # primary: strong open tool-calling model
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.3
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: claude-opus-4-8 # heavier model, used sparingly if selected
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k3
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: claude-haiku-4-5 # fallback / cheap-turn model
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.3-flash
      api_key: os.environ/NVIDIA_NIM_API_KEY
  # Friendly direct aliases for interactive use via scripts/claude-nim.sh
  # <shortcut>, so ANTHROPIC_MODEL can be set to the readable name directly.
  - model_name: glm
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.3
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: glm-flash
    litellm_params:
      model: nvidia_nim/z-ai/glm-5.3-flash
      api_key: os.environ/NVIDIA_NIM_API_KEY
  # Points at k3 because moonshotai/kimi-k2.6, while still listed in the
  # catalog, returns 404 "Not found for account" on this account.
  - model_name: kimi
    litellm_params:
      model: nvidia_nim/moonshotai/kimi-k3
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: deepseek
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4.1-flash
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: gpt-oss
    litellm_params:
      model: nvidia_nim/openai/gpt-oss-20b
      api_key: os.environ/NVIDIA_NIM_API_KEY

litellm_settings:
  # NIM doesn't support every Anthropic-specific param (e.g. some beta
  # headers); drop them instead of erroring so the agent loop doesn't stall.
  drop_params: true
  # NVIDIA NIM is OpenAI-compatible and the direct chat/completions route is
  # the one that supports tool calls reliably for the current hosted models.
  use_chat_completions_url_for_anthropic_messages: true
  num_retries: 3
  request_timeout: 600

general_settings:
  master_key: os.environ/PROXY_MASTER_KEY
