services:
  # Translates the Anthropic Messages protocol the Agent SDK speaks into the
  # OpenAI-compatible calls NVIDIA NIM serves. Replaced a LiteLLM service that
  # did the same job; see the README for what the swap bought.
  cliproxy:
    # Pinned to a release rather than `latest`: a proxy that silently changes
    # translation behaviour under you is the last thing you want to debug.
    image: eceasy/cli-proxy-api:v7.3.15
    # The image sets CMD but no ENTRYPOINT, so the binary has to be named here
    # explicitly.
    command: ["./CLIProxyAPI", "--config", "/CLIProxyAPI/config.yaml"]
    # CPA runs as root in the image and writes cooldown state and logs into the
    # mounted auth-dir, which leaves root-owned files on the host that a normal
    # user then can't clean up. Same reason agent/entrypoint.sh drops to
    # HOST_UID/HOST_GID via gosu.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Rendered by scripts/render-cliproxy-config.sh -- CPA has no env-var
      # interpolation, so the keys are literal in this file. Read-write rather
      # than :ro because CPA rewrites the config in place when it hashes a
      # plaintext management secret.
      - ./proxy/cliproxy-config.yaml:/CLIProxyAPI/config.yaml
      - ./proxy/auths:/CLIProxyAPI/auths
      # Request logs land here. ResolveLogDirectory prefers ./logs relative to
      # the working directory when it is writable, which this mount makes it --
      # otherwise they would end up buried under the auth dir.
      - ./proxy/logs:/CLIProxyAPI/logs
    ports:
      - "8317:8317"
    healthcheck:
      # The image is a bare debian:bookworm -- no curl, wget or python3 -- but it
      # does ship bash, so /dev/tcp gives a real HTTP check rather than a
      # decorative one. Folded block scalar (not a quoted string) so the \r\n
      # reach printf as backslash escapes instead of being eaten by YAML.
      # This proves the proxy answers; whether the NIM key is valid is what
      # scripts/validate-proxy.sh tests.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8317 &&
          printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 6

  agent:
    build: ./agent
    depends_on:
      cliproxy:
        condition: service_healthy
    environment:
      ANTHROPIC_BASE_URL: "http://cliproxy:8317"
      ANTHROPIC_AUTH_TOKEN: "${PROXY_MASTER_KEY}"
      AGENT_MODEL: "${AGENT_MODEL:-claude-sonnet-4-6}"
      AGENT_FALLBACK_MODEL: "${AGENT_FALLBACK_MODEL:-claude-haiku-4-5}"
      AGENT_PERMISSION_MODE: "${AGENT_PERMISSION_MODE:-bypassPermissions}"
      AGENT_MAX_TURNS: "${AGENT_MAX_TURNS:-40}"
      AGENT_CWD: /workspace
      VERIFY_TIMEOUT_MS: "${VERIFY_TIMEOUT_MS:-120000}"
      VERIFY_MAX_OUTPUT_CHARS: "${VERIFY_MAX_OUTPUT_CHARS:-4000}"
      GIT_USER_NAME: "${GIT_USER_NAME:-nim-self-verifying-agent}"
      GIT_USER_EMAIL: "${GIT_USER_EMAIL:-agent@example.invalid}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      HOST_UID: "${HOST_UID:-1000}"
      HOST_GID: "${HOST_GID:-1000}"
    volumes:
      - ./workspace:/workspace
    # No host Docker socket, no privileged mode. Add an egress allowlist
    # (NIM + GitHub only) at the network layer before running with real
    # credentials against an untrusted prompt.
